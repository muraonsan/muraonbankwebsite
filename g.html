<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>村音バンク公式サイト</title>

    <style>
        :root {
            --main-color: #333;
            --accent-color: #000;
            --bg-color: #fff;
            --tiny-font: 5px; /* 極小フォントサイズ */
        }

        body {
            font-family: sans-serif;
            line-height: 1.8;
            color: var(--main-color);
            background-color: var(--bg-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 40px;
        }

        /* 本文中の注釈番号を極小化するクラス */
        .trap-note {
            font-size: var(--tiny-font);
            vertical-align: super; /* 上付き文字っぽく配置 */
            color: #ff0000;           /* 少し薄くして存在感を消す 999 */
            letter-spacing: -1px;  /* 文字間を詰めてさらに読みづらく */
            display: inline-block;
            transform: scale(0.5); /* ブラウザの最小フォント制限を突破 */
            transform-origin: bottom left;
        }

        /* フッターの条文（さらに読めない） */
        .footer-clauses {
            margin-top: 100px;
            color: #ccc; /* ほとんど背景に溶け込むグレー */
        }

        .clause-text {
            font-size: var(--tiny-font);
            display: block;
            transform: scale(0.4); /* さらに縮小 */
            transform-origin: left top;
            line-height: 1;
        }

        /* ここからにゅーすらん*/
        .news-container {
    width: 80%;
    margin: 0 auto;
    font-family: sans-serif;
}

.news-list {
    list-style: none; /* ドットを消す */
    padding: 0;
}

.news-list li {
    padding: 10px 0;
    border-bottom: 1px solid #ccc; /* 下線 */
}

.date {
    color: #666;
    margin-right: 15px;
    font-size: 0.9em;
}

.content {
    color: #333;
}

.flex-container {
  display: flex;       /* 横並びにする */
  align-items: center; /* 上下の中央に揃える */
  gap: 10px;          /* 画像と文字の間の余白 */
}

.icon-img {
  width: 100px;         /* 画像の横幅を調整 */
  height: auto;
}

    </style>
</head>
